<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#bg{inset:0;background:radial-gradient(900px 900px at 50% 45%,#1b1b1b 0%,#000 70%)}
#grid{inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:90px 90px}
#brand{top:70px;left:0;right:0;display:flex;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:14px;padding:14px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.25);font-size:30px;font-weight:600}
.pb{width:46px;height:46px;border-radius:12px;background:#fff;color:#000;display:grid;place-items:center;font-weight:900;font-size:22px}

/* INTRO */
#intro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#dl{font-size:44px;font-weight:600;letter-spacing:.5em;color:#bbb;margin-left:.5em}
#num{position:relative;height:420px;width:600px;overflow:hidden;margin:10px 0}
#num div{position:absolute;left:0;right:0;font-size:420px;font-weight:900;line-height:420px;letter-spacing:-.06em}
#sub{font-size:58px;font-weight:700;line-height:1.15;padding:0 90px;letter-spacing:-.01em}
#sub em{font-style:normal;background:#fff;color:#000;padding:0 14px;border-radius:10px}
#bar{width:0;height:6px;background:#fff;margin-top:50px;border-radius:9px}

/* RULETA */
#wheelwrap{left:90px;top:420px;width:900px;height:900px}
#wheel{width:900px;height:900px;border-radius:50%;box-shadow:0 0 0 14px #fff,0 0 0 16px #000,0 0 0 20px #555,0 60px 160px rgba(255,255,255,.08)}
#hub{left:375px;top:375px;width:150px;height:150px;border-radius:50%;background:#000;border:10px solid #fff;display:grid;place-items:center;font-weight:900;font-size:44px;color:#fff;letter-spacing:-.04em}
#pin{left:505px;top:372px;width:0;height:0;border-left:35px solid transparent;border-right:35px solid transparent;border-top:80px solid #fff;filter:drop-shadow(0 8px 14px rgba(0,0,0,.7))}
#pin{left:505px}
#rtitle{left:0;right:0;top:220px;text-align:center;font-size:76px;font-weight:900;letter-spacing:-.03em}
#rtitle small{display:block;font-size:34px;font-weight:500;color:#aaa;letter-spacing:0;margin-top:10px}
#result{left:90px;right:90px;top:1400px;padding:44px 50px;border-radius:40px;background:#fff;color:#000;text-align:center;box-shadow:0 40px 120px rgba(255,255,255,.15)}
#result .k{font-size:30px;letter-spacing:.3em;font-weight:700;color:#666}
#result .p{font-size:128px;font-weight:900;letter-spacing:-.05em;line-height:1.05;margin-top:6px}
#result .d{font-size:38px;font-weight:600;margin-top:6px}
#result ul{list-style:none;display:flex;justify-content:center;gap:16px;margin-top:22px;flex-wrap:wrap}
#result li{font-size:28px;font-weight:600;border:2px solid #000;border-radius:999px;padding:8px 20px}
#flash{inset:0;background:#fff;opacity:0}
.conf{width:18px;height:30px;border-radius:4px}
</style></head><body>
<div id="bg" class="abs"></div><div id="grid" class="abs"></div>
<div id="brand" class="abs"><div class="chip"><div class="pb">PB</div>Pixel Studio Bolivia</div></div>

<div id="intro" class="abs">
  <div id="dl">DÍA</div>
  <div id="num"><div id="n1">1</div><div id="n2">2</div></div>
  <div id="sub">Creándole páginas web a negocios que <em>no tienen</em></div>
  <div id="bar"></div>
</div>

<div id="rtitle" class="abs">¿Qué página le toca?<small>Gira la ruleta 🎯</small></div>
<div id="wheelwrap" class="abs">
  <svg id="wheel" viewBox="-450 -450 900 900"></svg>
  <div id="hub" class="abs">PB</div>
</div>
<div id="pin" class="abs"></div>
<div id="result" class="abs">
  <div class="k">LE TOCÓ</div>
  <div class="p">1.500 Bs</div>
  <div class="d">Página con reservas y panel</div>
  <ul><li>📅 Reservas</li><li>📊 Panel</li><li>💬 WhatsApp</li></ul>
</div>
<div id="confs"></div>
<div id="flash" class="abs"></div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), pr=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function set(id,o,tr){const e=$(id);e.style.opacity=o;e.style.transform=tr||'';e.style.visibility=o<=.001?'hidden':'visible'}

// 6 sectores (cada precio 2 veces) en blanco / negro / gris
const SEG=[{p:'400',l:'Informativa',c:'#fff',f:'#000'},{p:'700',l:'Con catálogo',c:'#000',f:'#fff'},{p:'1.500',l:'Reservas + panel',c:'#2a2a2a',f:'#fff'},
           {p:'400',l:'Informativa',c:'#fff',f:'#000'},{p:'700',l:'Con catálogo',c:'#000',f:'#fff'},{p:'1.500',l:'Reservas + panel',c:'#2a2a2a',f:'#fff'}];
(function(){let s='';const n=SEG.length,R=440;
 SEG.forEach((g,i)=>{const a0=(i/n)*2*Math.PI-Math.PI/2,a1=((i+1)/n)*2*Math.PI-Math.PI/2;
  s+=`<path d="M0 0 L${R*Math.cos(a0)} ${R*Math.sin(a0)} A${R} ${R} 0 0 1 ${R*Math.cos(a1)} ${R*Math.sin(a1)} Z" fill="${g.c}" stroke="#777" stroke-width="2"/>`;
  const am=(a0+a1)/2*180/Math.PI+90;
  s+=`<g transform="rotate(${am})"><text y="-300" text-anchor="middle" fill="${g.f}" font-size="70" font-weight="900" font-family="Inter" letter-spacing="-3">${g.p}</text><text y="-245" text-anchor="middle" fill="${g.f}" font-size="30" font-weight="700" font-family="Inter">Bs</text><text y="-195" text-anchor="middle" fill="${g.f}" font-size="27" font-weight="600" font-family="Inter" opacity=".8">${g.l}</text></g>`;});
 for(let i=0;i<24;i++){const a=i/24*2*Math.PI;s+=`<circle cx="${428*Math.cos(a)}" cy="${428*Math.sin(a)}" r="6" fill="#fff" stroke="#000" stroke-width="2"/>`}
 $('wheel').innerHTML=s;})();
// confeti b/n
const CF=[];for(let i=0;i<60;i++){const d=document.createElement('div');d.className='abs conf';d.style.background=i%3?'#fff':'#888';$('confs').appendChild(d);CF.push({e:d,x:540+(Math.random()-.5)*200,vx:(Math.random()-.5)*1600,vy:-900-Math.random()*1300,r:Math.random()*720})}

// TIEMPOS (s)
const T={introEnd:2.6, spin0:3.0, spin1:7.6, res:7.8, END:10.5};
// sector 1.500 = índice 2 (centro en 150°). Para que quede arriba: rot = -150 + 360*k
const FINAL=360*6-150;
window.render=function(t){
  // INTRO
  const ii=pr(t,0,.5), io=pr(t,T.introEnd-.3,T.introEnd+.1);
  set('intro',ii*(1-io),`scale(${(.9+.1*back(ii))*(1+io*.15)})`);
  const flip=eio(pr(t,.6,1.2));
  $('n1').style.transform=`translateY(${-flip*420}px)`;$('n2').style.transform=`translateY(${(1-flip)*420}px) scale(${1+.15*Math.max(0,1-Math.abs(t-1.25)/.2)})`;
  $('dl').style.opacity=pr(t,.1,.5);
  const sp=pr(t,1.1,1.6);$('sub').style.opacity=sp;$('sub').style.transform=`translateY(${(1-eo(sp))*40}px)`;
  $('bar').style.width=(eo(pr(t,1.4,2.4))*700)+'px';
  // RULETA
  const wi=pr(t,T.introEnd,T.introEnd+.5);
  set('wheelwrap',wi,`scale(${.6+.4*back(wi)})`);set('pin',wi,`translateY(${(1-eo(wi))*-80}px)`);
  const ri=pr(t,T.introEnd+.1,T.introEnd+.5), ro=pr(t,T.res-.2,T.res+.2);
  set('rtitle',ri*(1-ro),`translateY(${(1-eo(ri))*-40}px)`);
  const s=pr(t,T.spin0,T.spin1); const rot=eo5(s)*FINAL;
  $('wheel').style.transform=`rotate(${rot}deg)`;
  // el puntero rebota en cada clavija
  const peg=(rot%15)/15; $('pin').style.transform=`rotate(${s>0&&s<1?-Math.max(0,1-peg*4)*18:0}deg)`;$('pin').style.transformOrigin='50% 0';
  // zoom al final
  const z=eio(pr(t,T.res,T.res+.6));
  $('wheelwrap').style.transform=`scale(${1-.25*z}) translateY(${-z*260}px)`;$('pin').style.top=(372-z*190)+'px';
  // resultado
  const r=pr(t,T.res,T.res+.45);set('result',r,`translateY(${(1-eo(r))*200 - z*80}px) scale(${.8+.2*back(r)})`);
  $('flash').style.opacity=.6*Math.max(0,1-Math.abs(t-T.res)/.15);
  const c=pr(t,T.res,T.res+2.2);CF.forEach(f=>{const tt=c*2.2;f.e.style.left=(f.x+f.vx*tt*.5)+'px';f.e.style.top=(1000+f.vy*tt+1400*tt*tt)+'px';f.e.style.opacity=c>0&&c<1?1:0;f.e.style.transform=`rotate(${f.r*tt}deg)`});
  return T.END;
};
window.ready=()=>true;
if(!new URLSearchParams(location.search).get('render')){let t0=performance.now();(function L(){const t=(performance.now()-t0)/1000;if(t>render(t))t0=performance.now();requestAnimationFrame(L)})()}
</script></body></html>
